<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4EFE6" />
  <meta name="description" content="Inkline Customs - a deduction and inspection sim. Every ship lies. The ink tells the truth." />
  <title>Inkline Customs - Every ship lies. The ink tells the truth.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F4EFE6'/%3E%3Cpath d='M6 22c3-1 6-1 10 0s7 1 10 0' stroke='%231C1A17' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 22V12l8-4 8 4v10' stroke='%231C1A17' stroke-width='1.4' fill='none'/%3E%3Ccircle cx='16' cy='9' r='2.4' fill='none' stroke='%23B3372F' stroke-width='1.6'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header id="hud" aria-label="Desk status"></header>
    <main id="desk">
      <section id="viewport" aria-label="Quay diorama">
        <canvas id="diorama"></canvas>
        <div id="tool-tray" role="toolbar" aria-label="Inspector tools"></div>
        <div id="wait-note" hidden>
          <p>The quay is empty.</p>
          <p class="wait-sub">The next ship rides in on the tide&hellip;</p>
        </div>
        <div id="scale-tooltip" hidden></div>
      </section>
      <section id="paperwork">
        <nav id="doc-tabs" role="tablist" aria-label="Documents"></nav>
        <div id="doc-panel" role="tabpanel" tabindex="0"></div>
        <div id="stamp-overlay" hidden></div>
        <div id="verdict-bar" aria-label="Verdict stamps"></div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <dialog id="card-dialog"></dialog>
    <dialog id="seed-dialog"></dialog>
    <div id="sr-live" class="sr-only" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
