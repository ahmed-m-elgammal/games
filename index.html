<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17123a" />
  <meta name="description" content="Moonpetal — a cozy bedtime merge-garden. Wind down, merge moonlight, grow a night garden, meet soft creatures." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moonpetal" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <title>Moonpetal — a cozy bedtime garden</title>
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="Moonpetal game stage. A 7 by 9 merge board of glowing night items." role="application"></canvas>
    <div id="hud"></div>
    <nav id="nav" aria-label="Main">
      <button class="navbtn" data-nav="board" aria-label="Merge board"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" opacity=".9"/><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"/></svg><span>Board</span></button>
      <button class="navbtn" data-nav="garden" aria-label="Night garden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20v-6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M12 14c-3.6-.4-5-2.6-5.2-5.6C9.6 8.6 11.6 9.8 12 12c.4-2.2 2.4-3.4 5.2-3.6-.2 3-1.6 5.2-5.2 5.6z" fill="currentColor" opacity=".85"/></svg><span>Garden</span></button>
      <button class="navbtn" data-nav="journal" aria-label="Creature journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h9.4A2.6 2.6 0 0 1 18 7.1v12.4H8.6A2.6 2.6 0 0 1 6 16.9z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 9h6M9 12.4h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>Journal</span></button>
      <button class="navbtn" data-nav="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.6v2.2M12 17.2v2.2M4.6 12h2.2M17.2 12h2.2M6.8 6.8l1.6 1.6M15.6 15.6l1.6 1.6M17.2 6.8l-1.6 1.6M8.4 15.6l-1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Settings</span></button>
    </nav>
    <div id="dim" aria-hidden="true"></div>
    <div id="toast" role="status"></div>
    <div id="overlay"></div>
    <div id="fader" aria-hidden="true"></div>
    <div id="sr" aria-live="polite" class="visually-hidden"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
